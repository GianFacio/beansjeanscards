<!doctype html>
<html lang="en">

<head>
    <!-- Page metadata and shared stylesheet links. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Beans Jeans Card Club</title>

    <link rel="stylesheet" href="styles.css">
    <!-- Warm the database host connection before the card list and photos load. -->
    <link rel="preconnect" href="https://tmskcpzbcszpxydrpepj.supabase.co" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- The header contains the site name and theme toggle. -->
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="index.html">Beans Jeans Card Club</a>
            <div class="header-actions">
                <button type="button" class="btn-outline theme-secondary btn-icon theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
                    <i class="bi bi-circle-half header-icon" aria-hidden="true"></i>
                </button>
                <a class="community-header-link" href="community.html">Collectors</a>
                <button type="button" id="admin-access-toggle" class="btn-outline theme-secondary btn-icon theme-toggle" aria-label="Admin sign in" title="Admin sign in">
                    <svg class="header-icon header-lock-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                    </svg>
                </button>
                <button type="button" id="add-card-toggle" class="btn-outline theme-secondary btn-icon theme-toggle" aria-label="Add a card" title="Add a card" hidden>
                    <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                    </svg>
                </button>
            </div>
        </div>
    </header>
    <!-- The landing page introduces the club and points visitors toward collectors. -->
    <main class="home-hero">
        <h1>Welcome to Beans Jeans Card Club</h1>
        <p class="home-hero-description">A place for collectors to share the cards they love and discover the people behind the collections.</p>
        <div class="home-hero-actions">
            <a class="home-hero-primary" href="community.html">Search Collectors</a>
            <a class="home-hero-secondary" href="community.html?signin=1">Sign In / Join</a>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="store-data.js"></script>
    <script src="admin-access.js"></script>
    <script src="community-navigation.js"></script>

    <!-- Shared light/dark theme behavior. -->
    <script src="theme.js"></script>
</body>

</html>
